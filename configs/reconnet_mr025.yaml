run_name: reconnet_mr025
seed: 123
device: cuda

data:
  train_dir: data/train/Train400
  val_dir: data/test/Set11
  patch_size: 99
  batch_size: 16
  num_workers: 4
  augment: true

cs:
  block_size: 33
  measurement_rate: 0.25

model:
  kind: reconnet
  channels: 16
  blocks: 4

train:
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0
  loss: l1
  save_dir: runs/reconnet_mr025
  log_every: 50
